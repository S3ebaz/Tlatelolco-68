<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tlatelolco 1968</title>
<style>
body{margin:0;background:#1A1614;color:#F3EBD8;font-family:Georgia,serif;line-height:1.55}
.w{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 10px}
.sub{color:#C45C4A;font-style:italic}
.gold{color:#D4B36A}
.box{background:#2A241E;border:1px solid #5C5142;padding:12px;margin-top:12px}
.row{overflow-x:auto;white-space:nowrap;padding:8px 0}
.row button{margin-right:6px;margin-bottom:6px;background:#3A2A22;color:#F7E7B0;border:1px solid #D4B36A;padding:8px 10px;font-size:14px}
.row button.on{background:#D4B36A;color:#1A1614}
h2{font-size:20px;margin:0 0 8px}
p{margin:0 0 8px}
.note{color:#C4B8A4;font-style:italic;font-size:14px}
</style>
</head>
<body>
<div class="w">
<p class="gold">2 de octubre no se olvida</p>
<h1>Ellas en el 68</h1>
<p class="sub">Sirve en celulares antiguos. Sin fotos pesadas.</p>
<p id="msg">Cargando fechas...</p>
<div class="row" id="row"></div>
<div class="box">
<p class="gold" id="kicker">Inicio</p>
<h2 id="tit">Tlatelolco 1968</h2>
<div id="txt"><p>Toca una fecha arriba.</p></div>
<p class="note" id="nota"></p>
</div>
</div>
<script>
var DATOS = [
["22 jul","Inicio","Ellas tambien estaban desde el primer dia","El conflicto empieza en La Ciudadela. Al dia siguiente hay represion en la Vocacional 5. Ya hay estudiantes del IPN y de la UNAM: mujeres y hombres."],
["Brigadas","Julio-agosto","Las brigadas: columna del movimiento","Las brigadas rompian el cerco de la prensa. Mujeres subian a camiones y explicaban el pliego de seis puntos."],
["2 ago","Auge","Mujeres en el CNH","Roberta Avendano (La Tita) y Ana Ignacia Rodriguez (La Nacha), de Derecho UNAM; Myrthokleia Gonzalez, del IPN; Marcia Gutierrez y Adriana Corona."],
["13 ago","Auge","Ellas en las grandes marchas","El 13 de agosto marchan al Zocalo. El 27 hay una marcha enorme. El 28 el ejercito desaloja la plaza."],
["Madres","Agosto-septiembre","Madres y vecinas","Adela Salazar dirigio el Comite de Padres. Elena Poniatowska reunio testimonios de mas de cien mujeres."],
["13 sep","Septiembre","La Marcha del Silencio","Cientos de miles caminan en silencio. El 18 de septiembre el ejercito toma CU. La Nacha es detenida."],
["23 sep","Septiembre","Convocatoria al 2 de octubre","Atacan Santo Tomas (IPN). El CNH convoca el mitin en la Plaza de las Tres Culturas."],
["16:00","2 de octubre","Llegan ellas a la plaza","Llegan estudiantes, vecinas y maestras. La Nacha, La Tita y Myrthokleia estan ahi."],
["17:55","2 de octubre","La senal y el cerco","Hay bengalas y disparos. La Nacha y La Tita salen con vida. El memorial guarda nombres de mujeres."],
["Carcel","1968-1970","Santa Martha Acatitla","Cuatro mujeres permanecen presas anos: La Tita, La Nacha, Amada Velasco y Adela Salazar."],
["Hoy","Memoria","Que no las vuelvan a borrar","Cada 2 de octubre la marcha sale de Tlatelolco. 2 de octubre no se olvida."]
];
function ver(i){
  var d = DATOS[i];
  document.getElementById("kicker").innerHTML = d[1];
  document.getElementById("tit").innerHTML = d[2];
  document.getElementById("txt").innerHTML = "<p>" + d[3] + "</p>";
  document.getElementById("nota").innerHTML = d[0];
  var btns = document.getElementById("row").getElementsByTagName("button");
  var n;
  for(n=0;n<btns.length;n++){ btns[n].className = (n===i) ? "on" : ""; }
}
var row = document.getElementById("row");
var i;
for(i=0;i<DATOS.length;i++){
  var b = document.createElement("button");
  b.innerHTML = DATOS[i][0];
  b.setAttribute("data-i", String(i));
  b.onclick = function(){ ver(parseInt(this.getAttribute("data-i"),10)); };
  row.appendChild(b);
}
ver(0);
document.getElementById("msg").innerHTML = "Toca una fecha.";
if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
  navigator.serviceWorker.getRegistrations().then(function(rs){
    var j; for(j=0;j<rs.length;j++){ rs[j].unregister(); }
  });
}
</script>
</body>
</html>
